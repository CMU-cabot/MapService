openapi: 3.0.2
info:
  title: MapService API
  description: MapService API for CaBot (Hokoukukan 2018)
  contact:
    email: daisukes@cmu.edu
  license:
    name: MIT
    url: https://github.com/CMU-cabot/MapService/blob/cabot-hokoukukan_2018/LICENSE
  version: 1.0.0
servers:
  - url: http://localhost:9090/map
tags:
  - name: map
    description: Retrieve map geojson features and query routes
paths:
  /routesearch?action=start:
    get:
      tags:
        - map
      summary: Start routesearch session
      description: ''
      operationId: start
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lng'
        - $ref: '#/components/parameters/dist'
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/landmarks'
        '405':
          description: Invalid input
  /routesearch?action=disabled_nodes:
    get:
      tags:
        - map
      summary: Get disabled nodes
      description: This returns all nodes those are disabled by ruleds
      operationId: disabled_nodes
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lng'
        - $ref: '#/components/parameters/dist'
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/node-features'
        '405':
          description: Invalid input
  /routesearch?action=facilities:
    get:
      tags:
        - map
      summary: Get all facility
      description: This returns all facility features
      operationId: facilities
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lng'
        - $ref: '#/components/parameters/dist'
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/facilities'
        '405':
          description: Invalid input
  /routesearch?action=features:
    get:
      tags:
        - map
      summary: Get all features except Node for the session
      description: This return other features like Link, Facility, and etc.
      operationId: features
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/features'
        '405':
          description: Invalid input
        '408':
          description: Need to call start
  /routesearch?action=landmarks:
    get:
      tags:
        - map
      summary: Get all landmarks for the user
      description: ''
      operationId: landmarks
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lng'
        - $ref: '#/components/parameters/dist'
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/cache'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/landmarks'
        '405':
          description: Invalid input
  /routesearch?action=raw_landmarks:
    get:
      tags:
        - map
      summary: Get nearby landmarks
      description: ''
      operationId: raw_landmarks
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lng'
        - $ref: '#/components/parameters/dist'
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/cache'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/landmarks'
        '405':
          description: Invalid input
  /routesearch?action=last_updated:
    get:
      tags:
        - map
      summary: Get last updated time of route data
      description: This returns the last updated time of the route data
      operationId: last_updated
      parameters:
        - $ref: '#/components/parameters/user'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/last_updated'
        '405':
          description: Invalid input
  /routesearch?action=nodemap:
    get:
      tags:
        - map
      summary: Get nodemap for the session
      description: This returns all Node features in the session as a map of Node ID and Node
      operationId: nodemap
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nodemap'
        '405':
          description: Invalid input  
  /routesearch?action=search:
    get:
      tags:
        - map
      summary: Get a route
      description: This return a sequence of Node, Link as a route
      operationId: search
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/preferences'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/route'
        '405':
          description: Invalid input
  /routesearch?action=linkcover:
    get:
      tags:
        - map
      summary: Get an open or closed route covering required links on the start floor
      description: >-
        This returns a sequence of Node and Link features. Omit `to` and
        `coverage_state` for the backward-compatible closed CPP route. For
        replanning, covered links are optional RPP connector edges, excluded links
        are removed, and other links are required. If `from` is in the interior of
        an excluded link, an explicit `to` and a traversal-history tail identifying
        the entry endpoint allow one temporary split fragment to be prepended as a
        fixed retreat. The excluded link remains outside the RPP graph, and this
        fixed prefix is excluded from candidate distance, signature, and D-opt
        comparison. When `from_heading_deg` is supplied, the first Euler edge is
        constrained to the edge in the RPP-augmented graph whose departure tangent
        has the smallest circular difference from the robot heading. The fixed
        retreat takes precedence over this heading preference. A metric-closure MST follows the
        framework in Frederickson, "Approximation Algorithms for Some Postman
        Problems" (1979); odd-degree matching follows Edmonds and Johnson,
        "Matching, Euler Tours and the Chinese Postman" (1973); randomized
        Hierholzer candidates and planned-route-only D-opt evaluation are based on
        Gao et al., "Active Loop Closure for OSM-guided Robotic Mapping in
        Large-Scale Urban Environments" (2024). Call `routesearch?action=start`
        first with the same `user` and `lang`.
      operationId: linkcoverGet
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/from_heading_deg'
        - $ref: '#/components/parameters/linkcover_to'
        - $ref: '#/components/parameters/coverage_state'
        - $ref: '#/components/parameters/allow_subgraph'
        - $ref: '#/components/parameters/solver'
        - $ref: '#/components/parameters/all'
        - $ref: '#/components/parameters/attempts'
        - $ref: '#/components/parameters/preferences'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/linkcover_response'
        '405':
          description: Invalid input
        '400':
          description: >-
            Invalid heading or coverage state, unreachable required links/end
            point, or an excluded current-position link without explicit to and an
            unambiguous entry endpoint in the traversal-history tail
    post:
      tags:
        - map
      summary: Plan or replan an open or closed link-cover route
      description: >-
        POST is recommended when coverage_state contains a long traversal history.
        The behavior and algorithmic basis are identical to the GET operation.
      operationId: linkcoverPost
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/from_heading_deg'
        - $ref: '#/components/parameters/linkcover_to'
        - $ref: '#/components/parameters/coverage_state'
        - $ref: '#/components/parameters/allow_subgraph'
        - $ref: '#/components/parameters/solver'
        - $ref: '#/components/parameters/all'
        - $ref: '#/components/parameters/attempts'
        - $ref: '#/components/parameters/preferences'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/linkcover_response'
        '400':
          description: >-
            Invalid heading or coverage state, unreachable required links/end
            point, or an excluded current-position link without explicit to and an
            unambiguous entry endpoint in the traversal-history tail
  /routesearch?action=toilets:
    get:
      tags:
        - map
      summary: Get all toilet facility
      description: This returns all facility features associated with toilet
      operationId: toilets
      parameters:
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lng'
        - $ref: '#/components/parameters/dist'
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/facilities'
        '405':
          description: Invalid input
components:
  schemas:
    features:
      type: array
      items:
        $ref: /spec/feature.json
    facil-features:
      type: array
      items:
        $ref: /spec/facil-feature.json
    node-features:
      type: array
      items:
        $ref: /spec/node-feature.json
    facilities:
      $ref: /spec/facilities.json
    landmarks:
      type: object
      properties:
        landmarks:
          type: array
          items:
            $ref: /spec/landmark.json
    last_updated:
      type: object
      properties:
        _id:
          type: string
          example: last_updated
        timestamp:
          type: object
          properties:
            $numberLong:
              type: string
              example: 1730915081234
    nodemap:
      $ref: /spec/nodemap.json
    route:
      $ref: /spec/route.json
    linkcover_candidate:
      type: object
      properties:
        d_optimality:
          type: number
          format: double
        route:
          $ref: '#/components/schemas/route'
    linkcover_candidates:
      type: object
      properties:
        best_route:
          $ref: '#/components/schemas/route'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/linkcover_candidate'
    linkcover_response:
      oneOf:
        - $ref: '#/components/schemas/route'
        - $ref: '#/components/schemas/linkcover_candidates'
        - type: object
          properties:
            error:
              type: string
              enum:
                - zero-distance
  parameters:
    allow_subgraph:
      name: allow_subgraph
      in: query
      description: if true, limit linkcover to links reachable from the start node within the same floor using traversable directions
      required: false
      schema:
        type: boolean
        default: true
    all:
      name: all
      in: query
      description: if true and solver=dopt, return all collected candidate routes and their d-optimality scores; attempts is capped by LINKCOVER_MAX_ALL_ATTEMPTS, which defaults to 200
      required: false
      schema:
        type: boolean
        default: false
    attempts:
      name: attempts
      in: query
      description: number of randomized Hierholzer trials used when solver=dopt; capped by LINKCOVER_MAX_ATTEMPTS, which defaults to 5000, and by LINKCOVER_MAX_ALL_ATTEMPTS, which defaults to 200 when all=true
      required: false
      schema:
        type: integer
        default: 1000
        minimum: 1
        maximum: 5000
    cache:
      name: cache
      in: query
      description: whether cache is used or not
      required: false
      schema:
        type: string
        example: false
    coverage_state:
      name: coverage_state
      in: query
      description: >-
        JSON object containing covered_link_ids, excluded_link_ids, and optional
        traversal_history. IDs are route link properties.coverage_link_id values.
        Excluded takes precedence over covered. History is validated but is not
        included in D-opt scoring in this version. If from is in the interior of
        an excluded link, the last history target_node_id must identify exactly one
        endpoint of that link; the server retreats to that endpoint using one
        temporary prefix before starting the RPP.
      required: false
      schema:
        type: string
        example: '{"covered_link_ids":["EDITOR_link_1"],"excluded_link_ids":["EDITOR_link_2"],"traversal_history":[]}'
    dist:
      name: dist
      in: query
      description: max distance from the center in meters
      required: true
      schema:
        type: number
        format: double
        example: 500
    from:
      name: from
      description: start point for route search, either node id or lat/lng coordinates (latlng:`lat`:`lng`:`floor` | `node_id`)
      in: query
      required: true
      schema:
        type: string
        example: latlng:35.61950:139.77700:1
    from_heading_deg:
      name: from_heading_deg
      description: >-
        optional robot heading for linkcover, in degrees clockwise from north.
        Values must be finite and between 0 and 360 inclusive; 360 is normalized
        to 0. The closest departure direction is selected only from start edges
        already present in the RPP-augmented graph. A fixed retreat from an
        excluded current-position link takes precedence.
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: 0
        maximum: 360
        example: 90
    lang:
      name: lang
      in: query
      description: language (default=en)
      required: false
      schema:
        type: string
        pattern: ^[a-zA-Z]{2}$
        example: en
    linkcover_to:
      name: to
      description: >-
        optional end point for linkcover; lat/lng input is rounded to the nearest
        node on the requested floor. It is required when from is in the interior
        of an excluded link so the fixed retreat cannot plan a closed route back
        onto that excluded position
      in: query
      required: false
      schema:
        type: string
        example: latlng:35.61950:139.77700:1
    lat:
      name: lat
      in: query
      description: center latitude
      required: true
      schema:
        type: number
        format: double
        example: '35.61950'
    lng:
      name: lng
      in: query
      description: center longitude
      required: true
      schema:
        type: number
        format: double
        example: '139.77700'
    preferences:
      name: preferences
      in: query
      description: preferences for the route search, such as using elevator/escalator
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              preset:
                type: string
                example: '9'
              min_width:
                type: string
                example: '8'
              dist:
                type: number
                example: 2000
              stairs:
                type: string
                example: '9'
              tactile_paving:
                type: string
                example: '1'
              mvw:
                type: string
                example: '1'
              slope:
                type: string
                example: '9'
              deff_LV:
                type: string
                example: '9'
              elv:
                type: string
                example: '9'
              road_condition:
                type: string
                example: '9'
              esc:
                type: string
                example: '1'
    solver:
      name: solver
      in: query
      description: route solver for linkcover (cpp returns one deterministic CPP/RPP trail, dopt evaluates randomized Hierholzer candidates with planned-route D-opt)
      required: false
      schema:
        type: string
        enum:
          - cpp
          - dopt
        default: dopt
    to:
      name: to
      description: end point for route search, either node id or lat/lng coordinates (latlng:`lat`:`lng`:`floor` | `node_id`)
      in: query
      required: true
      schema:
        type: string
        example: EDITOR_node_1674009577605
    user:
      name: user
      in: query
      description: any identifiable user id (session is valid for each user id)
      required: true
      schema:
        type: string
        example: user_id_string
